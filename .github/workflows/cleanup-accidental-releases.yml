name: Cleanup accidental 1.140 build releases

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-accidental-releases.yml'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove accidental build releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tags < <(
            gh release list               --repo "${GITHUB_REPOSITORY}"               --limit 100               --json tagName               --jq '.[].tagName' |
            grep -E '^v1\.140\.0-build\.[0-9]+$' || true
          )

          if [ "${#tags[@]}" -eq 0 ]; then
            echo "No accidental build releases found."
            exit 0
          fi

          for tag in "${tags[@]}"; do
            echo "Deleting accidental release and tag: $tag"
            gh release delete "$tag"               --repo "${GITHUB_REPOSITORY}"               --cleanup-tag               --yes
          done
